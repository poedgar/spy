# The simulator keyboard follows the Mac's input language. Password fields
# only accept what the on-screen keyboard can type, so switch to an English
# layout (one with a "q" key) before typing one. The globe key cycles
# through the installed keyboards (e.g. English, Ukrainian, Emoji).
appId: com.poedgar.marvelousgames
---
- extendedWaitUntil:
    visible: Next keyboard|q
    timeout: 5000
    optional: true
- repeat:
    times: 3
    while:
      notVisible: q
    commands:
      - tapOn:
          text: Next keyboard|English.*
          optional: true
      - waitForAnimationToEnd
