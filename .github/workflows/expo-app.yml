name: Mobile app

on:
  push:
    paths:
      - 'expo-app/**'
      - '.github/workflows/expo-app.yml'
  pull_request:
    paths:
      - 'expo-app/**'
      - '.github/workflows/expo-app.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: expo-app

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: expo-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx expo lint

      - name: Unit and screen tests
        run: npx jest --ci

      - name: Expo doctor
        run: npx expo-doctor
