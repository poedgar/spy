name: E2E (production)

on:
  push:
  schedule:
    - cron: '0 */24 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Cypress's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk2.0-0 libgtk-3-0 libgbm-dev libnotify-dev libnss3 libxss1 libasound2t64 libxtst6 xauth xvfb

      - name: Cache the Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: cypress-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Build frontend
        run: npm run build

      - name: Start local test server
        run: |
          npx vite preview --port 3000 --host 0.0.0.0 &
          node -e "const http=require('http');function check(){http.get('http://127.0.0.1:3000',r=>{console.log('Test server ready');process.exit(0)}).on('error',()=>setTimeout(check,300))};check()"

      - name: Run E2E smoke tests
        run: npm run test
        env:
          CYPRESS_BASE_URL: http://127.0.0.1:3000

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-production-screenshots
          path: cypress/screenshots
          if-no-files-found: ignore
